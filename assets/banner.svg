<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
  <defs>
    <!-- Background Linear Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="mesh-glow" cx="80%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>

    <!-- Filters -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow-card" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Style & Keyframe Animations -->
    <style>
      @keyframes flow-pulse {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes float-gentle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes float-reverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }
      @keyframes pulse-node {
        0%, 100% { r: 6; opacity: 0.9; }
        50% { r: 8.5; opacity: 0.4; }
      }
      @keyframes radar-spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .anim-flow-1 {
        stroke-dasharray: 12 18;
        animation: flow-pulse 4s linear infinite;
      }
      .anim-flow-2 {
        stroke-dasharray: 8 14;
        animation: flow-pulse 3s linear infinite reverse;
      }
      .anim-flow-3 {
        stroke-dasharray: 10 16;
        animation: flow-pulse 5s linear infinite;
      }
      .float-card-1 {
        animation: float-gentle 6s ease-in-out infinite;
      }
      .float-card-2 {
        animation: float-reverse 7s ease-in-out infinite;
      }
      .pulse-dot {
        animation: pulse-node 2.4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)" />
  <circle cx="980" cy="180" r="280" fill="url(#mesh-glow)" />

  <!-- Grid Overlay (Background) -->
  <g stroke="#334155" stroke-opacity="0.15" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- 2. Dynamic Reverse Proxy Infrastructure Graphic (Right Side Background/Middle) -->
  <g transform="translate(680, 20)">
    <!-- Flow Curves from Ingress to Upstreams -->
    <!-- Client Ingress Node -->
    <circle cx="80" cy="160" r="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <text x="80" y="165" font-size="12" fill="#38bdf8" font-weight="bold" text-anchor="middle">CLIENT</text>

    <!-- Reverse Proxy / Gateways Layer -->
    <rect x="200" y="100" width="130" height="120" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="2" filter="url(#shadow-card)" />
    <text x="265" y="130" font-size="13" fill="#a5b4fc" font-weight="bold" text-anchor="middle">REVERSE PROXY</text>
    <text x="265" y="152" font-size="10" fill="#38bdf8" text-anchor="middle">SSL • ROUTE • BALANCER</text>
    <rect x="225" y="170" width="80" height="22" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1" />
    <circle cx="238" cy="181" r="3" fill="#22c55e" />
    <text x="267" y="185" font-size="9" fill="#e2e8f0" font-weight="bold" text-anchor="middle">HEALTH: OK</text>

    <!-- Upstream Backend Services -->
    <g class="float-card-1">
      <rect x="400" y="55" width="95" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="447" y="78" font-size="11" fill="#f1f5f9" font-weight="bold" text-anchor="middle">Backend A</text>
      <text x="447" y="93" font-size="9" fill="#94a3b8" text-anchor="middle">:8080 (Docker)</text>
    </g>

    <g>
      <rect x="400" y="135" width="95" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="447" y="158" font-size="11" fill="#f1f5f9" font-weight="bold" text-anchor="middle">Backend B</text>
      <text x="447" y="173" font-size="9" fill="#94a3b8" text-anchor="middle">:3000 (Node.js)</text>
    </g>

    <g class="float-card-2">
      <rect x="400" y="215" width="95" height="50" rx="8" fill="#1e293b" stroke="#34d399" stroke-opacity="0.6" stroke-width="1.5" />
      <text x="447" y="238" font-size="11" fill="#f1f5f9" font-weight="bold" text-anchor="middle">Backend C</text>
      <text x="447" y="253" font-size="9" fill="#94a3b8" text-anchor="middle">:9000 (API/K8s)</text>
    </g>

    <!-- Animated Data Flow Lines -->
    <!-- Ingress to Proxy -->
    <line x1="104" y1="160" x2="200" y2="160" stroke="#38bdf8" stroke-width="2.5" class="anim-flow-1" />
    <circle cx="152" cy="160" r="5" fill="#38bdf8" class="pulse-dot" />

    <!-- Proxy to Upstreams -->
    <path d="M 330 140 C 365 140, 365 80, 400 80" fill="none" stroke="#38bdf8" stroke-width="2" class="anim-flow-1" />
    <path d="M 330 160 C 365 160, 365 160, 400 160" fill="none" stroke="#c084fc" stroke-width="2" class="anim-flow-2" />
    <path d="M 330 180 C 365 180, 365 240, 400 240" fill="none" stroke="#34d399" stroke-width="2" class="anim-flow-3" />
  </g>

  <!-- 3. Foreground Content: Main Branding & Typography (Guaranteed 100% Legibility & Foreground) -->
  <g transform="translate(60, 50)">
    <!-- Top Category Tag -->
    <g transform="translate(0, 0)">
      <rect width="260" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="14" cy="14" r="5" fill="#22c55e" />
      <text x="28" y="19" font-size="11.5" fill="#38bdf8" font-weight="bold" letter-spacing="1">CURATED INFRASTRUCTURE ECOSYSTEM</text>
    </g>

    <!-- Main Title with Gradient Glow -->
    <text x="0" y="85" font-size="38" font-weight="900" fill="url(#primary-glow)" letter-spacing="-0.5" filter="url(#glow-light)">
      Awesome Reverse Proxy
    </text>
    <text x="0" y="130" font-size="38" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
      Management
    </text>

    <!-- Subtitle -->
    <text x="0" y="172" font-size="15" fill="#94a3b8" font-weight="500">
      Enterprise ADCs, Cloud Edge Gateways, and Self-Hosted Proxy Dashboards
    </text>
    <text x="0" y="195" font-size="13.5" fill="#64748b" font-weight="400">
      Automated Let's Encrypt TLS • Docker &amp; Kubernetes Native • L4/L7 Load Balancing
    </text>

    <!-- Feature Badges/Pills Row -->
    <g transform="translate(0, 225)">
      <!-- Pill 1: Web UI -->
      <g transform="translate(0, 0)">
        <rect width="112" height="32" rx="8" fill="url(#pill-bg)" stroke="#38bdf8" stroke-width="1" />
        <text x="56" y="20" font-size="11.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">🖥️ Web UI</text>
      </g>
      <!-- Pill 2: Auto TLS -->
      <g transform="translate(122, 0)">
        <rect width="128" height="32" rx="8" fill="url(#pill-bg)" stroke="#818cf8" stroke-width="1" />
        <text x="64" y="20" font-size="11.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">🔒 Auto HTTPS</text>
      </g>
      <!-- Pill 3: Load Balancing -->
      <g transform="translate(260, 0)">
        <rect width="138" height="32" rx="8" fill="url(#pill-bg)" stroke="#c084fc" stroke-width="1" />
        <text x="69" y="20" font-size="11.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">⚖️ Load Balancing</text>
      </g>
      <!-- Pill 4: Docker & K8s -->
      <g transform="translate(408, 0)">
        <rect width="138" height="32" rx="8" fill="url(#pill-bg)" stroke="#34d399" stroke-width="1" />
        <text x="69" y="20" font-size="11.5" fill="#e2e8f0" font-weight="600" text-anchor="middle">🐳 Docker / K8s</text>
      </g>
    </g>
  </g>
</svg>
